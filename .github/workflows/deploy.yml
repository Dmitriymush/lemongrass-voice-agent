name: Deploy

# Paid tier of the credit policy (docs/ARCHITECTURE.md §8.4). Every run here calls the
# model, so the triggers are narrow on purpose: main, or a deliberate manual run.
# Adding `pull_request` would make every PR spend sandbox credits — tests/workflows.test.mjs
# asserts that it is absent.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A second deploy landing mid-run would race the first over the same assistant.
concurrency:
  group: vapi-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write # only to commit state/resources.json back, see the last step

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Test suite
        run: npm test

      - name: Build assistant
        run: npm run build

      # The guardrail gate, and the condition on everything after it. Running the
      # scenarios needs a card on the Vapi org — POST /chat returns 402 without one —
      # so where that is not available the gate cannot run, and nothing may ship.
      # Set the repository variable RUN_EVAL to "true" once billing exists.
      #
      # Deploying is conditioned on the same variable rather than on the gate's
      # outcome, so the invariant holds either way: no deploy without a passing gate.
      - name: Run reviewer scenarios
        if: vars.RUN_EVAL == 'true'
        run: npm run eval
        env:
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
          VAPI_ASSISTANT_ID: ${{ secrets.VAPI_ASSISTANT_ID }}

      - name: Deploy to Vapi
        if: vars.RUN_EVAL == 'true'
        run: npm run deploy
        env:
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
          VAPI_ASSISTANT_ID: ${{ secrets.VAPI_ASSISTANT_ID }}

      - name: Explain why nothing was deployed
        if: vars.RUN_EVAL != 'true'
        run: |
          echo "Tests and build passed. Nothing was deployed."
          echo "The scenario gate needs a card on the Vapi org (POST /chat returns 402"
          echo "without one), and this pipeline does not ship without running it."
          echo "Set the repository variable RUN_EVAL=true to enable both steps."

      # Vapi files are immutable, so a changed fact sheet produces a new file id.
      # If that id is not committed back, the next deploy sees a stale hash, uploads
      # again, and the org slowly fills with orphaned copies.
      - name: Record new Vapi resource ids
        if: vars.RUN_EVAL == 'true'
        run: |
          if git diff --quiet -- state/resources.json; then
            echo "state/resources.json unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/resources.json
          git commit -m "Record Vapi resource ids after deploy [skip ci]"
          git push
